name: Deploy to GitHub Pages

# The site is plain static files, so there is nothing to build — the repository
# is published as-is.
#
# ONE-TIME SETUP, done by a repository admin in the browser:
#   Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions"
# That is what creates the Pages site. A workflow cannot do it for you: the
# REST call behind it needs `administration: write`, which the Actions
# GITHUB_TOKEN can never hold (actions/configure-pages' own `enablement` input
# documents that it "requires a token other than GITHUB_TOKEN").
#
# After that, every push to main republishes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Publish only the front-end. Without this the whole repo is served as
      # static files, including the API source under server/.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js i18n.js api.js config.js .nojekyll _site/
          cp -r img _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
