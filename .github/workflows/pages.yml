name: Deploy to GitHub Pages

# The site is plain static files, so there is nothing to build — the repository
# is published as-is. Set Settings → Pages → Source to "GitHub Actions" once,
# and every push to main republishes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .          # .git and .github are excluded by the action
      - id: deployment
        uses: actions/deploy-pages@v4
